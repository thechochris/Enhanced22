<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px "Segoe UI", system-ui, sans-serif; width: 340px; margin: 0; color: #1b2232; background: #fff; }
  header { padding: 10px 12px; background: #0a0e16; color: #fff; font-weight: 600; font-size: 14px; }
  section { padding: 10px 12px; border-bottom: 1px solid #e4e8f0; }
  .row { display: flex; gap: 8px; align-items: center; }
  select, button { font: inherit; }
  button { border: 1px solid #c5cddc; background: #f4f6fa; border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  #games { max-height: 300px; overflow-y: auto; padding: 0; }
  .wk { padding: 4px 12px; background: #f4f6fa; color: #5b667d; font-weight: 600; position: sticky; top: 0; }
  .game { padding: 6px 12px; cursor: pointer; display: flex; justify-content: space-between; }
  .game:hover { background: #eef3ff; }
  .game.active { background: #2f6fed; color: #fff; }
  .muted { color: #5b667d; }
  #status { min-height: 16px; }
  kbd { background: #f4f6fa; border: 1px solid #c5cddc; border-radius: 3px; padding: 0 4px; font-size: 11px; }
  .keys { line-height: 1.8; }
</style>
</head>
<body>
  <header>Enhanced22</header>
  <section>
    <div class="row">
      <label>Season <select id="season"></select></label>
      <button id="refresh" title="Download the latest play-by-play">Refresh data</button>
    </div>
    <div id="status" class="muted" style="margin-top:6px"></div>
  </section>
  <section id="active" class="muted">No game selected.</section>
  <div id="games"></div>
  <section>
    <div class="row" style="justify-content:space-between">
      <span id="audioStatus" class="muted">Broadcast audio: no source tab</span>
      <button id="audioBtn">Use this tab</button>
    </div>
  </section>
  <section class="keys muted">
    <kbd>S</kbd> sync next play at its snap · <kbd>X</kbd> play not in replay · <kbd>Z</kbd> undo<br>
    <kbd>N</kbd>/<kbd>P</kbd> next/previous play · <kbd>E</kbd> end of sideline view<br>
    <kbd>V</kbd> sideline view only · <kbd>O</kbd> overlay · <kbd>L</kbd> play list<br>
    Broadcast tab: <kbd>B</kbd> anchor audio at a snap · <kbd>U</kbd> remove last anchor
  </section>
  <script src="format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
